  const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.30,10),new THREE.MeshStandardMaterial({color:0xdfe6ea,roughness:0.4})); rod.position.y=1.02; s.add(rod);
  const thumb=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.025,16),new THREE.MeshStandardMaterial({color:0xe8eef1,roughness:0.4})); thumb.position.y=1.17; s.add(thumb);
  s.traverse(o=>{o.castShadow=true;}); return s; }
const Rprof=u=>0.46*(1-u)+0.30*u+Math.sin(u*Math.PI)*0.05;
function makeArm(variant){ const grp=new THREE.Group(); const refs={};
  const pts=[]; for(let i=0;i<=14;i++){ const u=i/14; pts.push(new THREE.Vector2(Math.max(Rprof(u),0.02),-1.35+u*2.7)); }
  const geo=new THREE.LatheGeometry(pts,36);
  let mat;
  if(variant==='xray') mat=new THREE.MeshPhysicalMaterial({color:0x9fd4f2,roughness:0.35,transparent:true,opacity:0.30});
  else mat=new THREE.MeshPhysicalMaterial({map:skinTexture(),roughness:0.48});
  const arm=new THREE.Mesh(geo,mat); arm.rotation.z=Math.PI/2; arm.castShadow=true; grp.add(arm);
  const vPts=[]; for(let i=0;i<=10;i++){ const x=-1.25+i*0.25; vPts.push(new THREE.Vector3(x,0.155+Math.sin(i*0.7)*0.012,0)); }

  if(variant==='xray'){

    const art=new THREE.Mesh(new THREE.TubeGeometry(artCurve,40,0.048,12),new THREE.MeshStandardMaterial({color:0xd63030,roughness:0.3})); grp.add(art);
    const cg=new THREE.SphereGeometry(0.040,10,8); cg.scale(1,0.45,1);

    const base=[]; for(let i=0;i<130;i++) base.push(Math.random());
    refs.cells=cells; refs.cellBase=base; refs.veinCurve=veinCurve; grp.add(cells);
    const pool=new THREE.Group(); for(let i=0;i<26;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.02+Math.random()*0.035,8,8),new THREE.MeshStandardMaterial({color:0xa81f1f,roughness:0.3}));
      b.position.set(0.30+(Math.random()-0.5)*0.28,0.045-(Math.random())*0.11,(Math.random()-0.5)*0.22); pool.add(b); }
    grp.add(pool); refs.pool=pool;
  } else {
    const sp=[]; for(let i=0;i<=8;i++){ const x=-1.2+i*0.3; const u=(1.35-x)/2.7; sp.push(new THREE.Vector3(x,Rprof(u)-0.02,0.03+Math.sin(i*1.3)*0.012)); }
    const sv=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sp),32,0.02,8),new THREE.MeshPhysicalMaterial({color:0x9db8dd,roughness:0.35,transparent:true,opacity:0.5}));
    grp.add(sv); refs.surfVein=sv;
  }
  if(variant==='bruise'){
    const bc=document.createElement('canvas'); bc.width=bc.height=128; const bg2=bc.getContext('2d');
    const grd=bg2.createRadialGradient(64,64,4,64,64,62); grd.addColorStop(0,'rgba(255,255,255,0.95)'); grd.addColorStop(0.55,'rgba(255,255,255,0.55)'); grd.addColorStop(1,'rgba(255,255,255,0)');
    bg2.fillStyle=grd; bg2.fillRect(0,0,128,128); const bt=new THREE.CanvasTexture(bc);
    const pp=[]; for(let i=0;i<=12;i++){ const v=i/12; pp.push(new THREE.Vector2(Math.max(Rprof(0.5+(v-0.5)*0.30)+0.014,0.02),-0.42+v*0.84)); }
    const pm=new THREE.Mesh(new THREE.LatheGeometry(pp,20,0.62,1.1),new THREE.MeshStandardMaterial({map:bt,color:0x4a1460,transparent:true,opacity:0,roughness:0.6}));
    pm.rotation.z=Math.PI/2; grp.add(pm); refs.patch=pm;
    const lump=new THREE.Mesh(new THREE.SphereGeometry(0.30,20,14),new THREE.MeshPhysicalMaterial({color:0xbd8a6e,roughness:0.5}));
    lump.scale.set(0.95,0.20,0.7); lump.position.set(0.30,0.375,0.02); grp.add(lump); refs.lump=lump;
    const dot=new THREE.Mesh(new THREE.CircleGeometry(0.02,10),new THREE.MeshBasicMaterial({color:0x6b4a3a}));
    dot.position.set(0.03,0.415,0.10); dot.rotation.x=-0.5; grp.add(dot); refs.dot=dot;

function flowCells(refs,t,speed){ if(!refs.cells) return; const m=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3(1,1,1);
  for(let i=0;i<130;i++){ const u=(refs.cellBase[i]+t*speed)%1; const p=refs.veinCurve.getPoint(u);
    p.x+=(Math.sin(i*12.9)*0.03); p.y+=(Math.cos(i*7.7)*0.028); p.z+=(Math.sin(i*5.3)*0.03);
    m.compose(p,q,sc); refs.cells.setMatrixAt(i,m); } refs.cells.instanceMatrix.needsUpdate=true; }

const clamp01=v=>Math.max(0,Math.min(1,v));
const ss=u=>{ u=clamp01(u); return u*u*u*(u*(u*6-15)+10); };

function syrPlace(s,x,y,z){ s.position.set(x,y,z); s.rotation.z=0.42; s.rotation.x=-0.12; }
function microFlow(t,speed,white){ const m=new THREE.Matrix4(),e=new THREE.Euler(),q=new THREE.Quaternion(),sc=new THREE.Vector3(1,1,1),p=new THREE.Vector3();

    e.set(0,0,t*0.7+i); q.setFromEuler(e); m.compose(p,q,sc); G.microCells.setMatrixAt(i,m); } G.microCells.instanceMatrix.needsUpdate=true;
  G.whiteCells.count=white?14:0;
  if(white){ for(let i=0;i<14;i++){ const u=(G.whiteBase[i]+t*speed*0.7)%1; p.set(-2.1+u*4.2,Math.sin(i*3.1)*0.4,Math.cos(i*2.3)*0.4);
