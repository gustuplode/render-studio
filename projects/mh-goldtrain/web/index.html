<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">

const W = 1080, H = 1920, FPS = 30, TOTAL = 1581;
const SEC = { hook:[0,143], cargo:[143,250], castle:[250,380], seal:[380,502], hunters:[502,646], whisper:[646,776], radar:[776,944], borehole:[944,1049], shape:[1049,1173], glint:[1173,1296], waiting:[1296,1445], finale:[1445,1581] };
const EV = { trainStop:162, sealStart:439, sealBoom:449, pings:[826,868,910], descent:944, glint:1228, winks:[1502,1551] };
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 400);
scene.add(camera);
const sstep = u => { u = THREE.MathUtils.clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const ramp = (t, a, b) => sstep((t - a) / (b - a));
const lerp = THREE.MathUtils.lerp;

/* ---------- lights ---------- */

const hemi = new THREE.HemisphereLight(0xd8ecff, 0x51663c, 0.9); scene.add(hemi);

sun.shadow.camera.far = 90; sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xfff4e0, 0.3); scene.add(fill); scene.add(fill.target);
function sunFrame(cx, cy, cz, dx = 18, dy = 26, dz = 14) {
  sun.position.set(cx + dx, cy + dy, cz + dz);
  sun.target.position.set(cx, cy, cz);
}
/* palettes: [bg, hemi, sunI, sunCol, fillI, exposure] */
const PAL = {
  dusk:  [new THREE.Color(0x51506e), 0.5, 0.85, new THREE.Color(0xff9a4a), 0.45, 1.02],
  day:   [new THREE.Color(0x87b5e0), 0.92, 2.05, new THREE.Color(0xfff1da), 0.30, 1.05],
  dayCool:[new THREE.Color(0x8fb8dd), 0.85, 1.85, new THREE.Color(0xf4ecd8), 0.32, 1.04],
  golden:[new THREE.Color(0x77688a), 0.55, 1.15, new THREE.Color(0xffb257), 0.36, 1.06],
  dark:  [new THREE.Color(0x04050a), 0.06, 0.0, new THREE.Color(0x000000), 0.0, 1.0],
};
function applyPal(name, cx = 0, cz = 8) {
  const p = PAL[name];
  scene.background.copy(p[0]); hemi.intensity = p[1]; sun.intensity = p[2]; sun.color.copy(p[3]);
  fill.intensity = p[4]; renderer.toneMappingExposure = p[5];

}

/* ---------- ground & landscape ---------- */
const grass = new THREE.Mesh(new THREE.CircleGeometry(150, 48), new THREE.MeshStandardMaterial({ color: 0x74ac54, roughness: 1 }));
grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true; scene.add(grass);
const dirt = new THREE.Mesh(new THREE.PlaneGeometry(90, 4.6), new THREE.MeshStandardMaterial({ color: 0x77694e, roughness: 1 }));
dirt.rotation.x = -Math.PI / 2; dirt.position.set(-6, 0.005, 8); dirt.receiveShadow = true; scene.add(dirt);

/* ---------- train set ---------- */

const PORTAL_X = 36 + hill.userData.portalX;   // 19.5
const castle = G.makeCastle(); castle.position.set(41, 6.0, 2.5); castle.rotation.y = -0.15; scene.add(castle);
// pines on the hill + field
const pines = [];
for (const [px, pz, ps] of [[14, 2, 1.1], [22, 16.5, 1.3], [30, -2, 1.0], [26, 22, 1.3], [-8, 3, 1.15], [-20, 15, 1.0], [44, 14, 1.25], [17, -3.5, 0.9]]) {
  const t = G.makePineTree(ps); t.position.set(px, 0, pz); scene.add(t); pines.push(t);
}
// deciduous trees for the 70-year leaf colour shift
const leafTrees = [];
for (const [px, pz] of [[-14, 14], [-16, 20], [30, 20.5], [18, 21.5]]) {
  const t = P.makeTree(1.05); t.position.set(px, 0, pz); scene.add(t); leafTrees.push(t);
}
const LEAF_COLS = [new THREE.Color(0x4d8f3a), new THREE.Color(0xc7a23a), new THREE.Color(0x9c5a2e), new THREE.Color(0x5da348)];
function setLeafPhase(k) { // k 0..3 continuous
  const mats = [];
  leafTrees.forEach(t => t.traverse(o => { if (o.isMesh && o.material.color && LEAF_COLS.some(c => o.material.color.equals(c))) mats.push(o.material); }));
  const a = LEAF_COLS[Math.floor(k) % 4], b = LEAF_COLS[(Math.floor(k) + 1) % 4], u = k - Math.floor(k);
  const c = a.clone().lerp(b, u);
  mats.forEach(m => m.color.copy(c));
}

/* ---------- the train ---------- */
const train = new THREE.Group(); scene.add(train);
const loco = G.makeLoco(); train.add(loco);
const wagons = [];
for (let i = 0; i < 3; i++) { const w = G.makeGoldWagon(1); w.position.set(-11.9 - i * 6.1, 0, 0); train.add(w); wagons.push(w); }
train.position.set(-3.15, 0.19, 8);
// footplate step for the engineer
const step1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x22262b }));
step1.position.set(-1.5, 0.95, 1.62); step1.castShadow = true; loco.add(step1);
// headlamp beam cone (additive, apex at lamp, opening forward +X)
function beamTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, 'rgba(255,230,170,0.85)'); gr.addColorStop(1, 'rgba(255,210,120,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 256);
  const t = new THREE.CanvasTexture(c); return t;
}
const beamMat = new THREE.MeshBasicMaterial({ map: beamTexture(), transparent: true, opacity: 0.34, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, color: 0xffd9a0 });
const beam = new THREE.Mesh(new THREE.ConeGeometry(1.05, 13, 24, 1, true), beamMat);
beam.rotation.z = Math.PI / 2;               // cone axis -> +X (apex at lamp after offset)
beam.position.set(4.6 + 6.5, 3.3, 0);
loco.add(beam);
const beamHalo = new THREE.Mesh(new THREE.ConeGeometry(2.0, 13, 24, 1, true),
  new THREE.MeshBasicMaterial({ map: beamTexture(), transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, color: 0xffc98a }));
beamHalo.rotation.z = Math.PI / 2; beamHalo.position.copy(beam.position); loco.add(beamHalo);
const lampLight = new THREE.PointLight(0xffc46b, 18, 13, 1.8); lampLight.position.set(4.75, 3.28, 0); loco.add(lampLight);
// loose gold crates beside the track (cargo beat dressing)
const cratePile = new THREE.Group();
for (let i = 0; i < 4; i++) { const c = G.makeGoldCrate(); c.position.set((i % 2) * 1.15 - 0.5, Math.floor(i / 2) * 0.57, (i % 3) * 0.3); c.rotation.y = i * 0.35; cratePile.add(c); }
cratePile.position.set(-14.6, 0, 12.4); scene.add(cratePile);
// sealed-mouth rock pile (appears at seal)
const sealPile = G.makeRockPile(14, 3.4); sealPile.position.set(PORTAL_X - 0.6, 0.1, 8); sealPile.visible = false; scene.add(sealPile);
// falling rocks + dust (seal beat)
const fallRocks = [];
for (let i = 0; i < 7; i++) {
  const r = G.makeRock(0.32 + (i % 3) * 0.14);
  r.userData.home = new THREE.Vector3(PORTAL_X - 0.7 + Math.sin(i * 2.7) * 1.6, 0.35 + (i % 3) * 0.3, 8 + Math.cos(i * 1.9) * 1.7);
  r.userData.top = r.userData.home.clone(); r.userData.top.y = 5.7 + (i % 4) * 0.35;   // start at the arch crown, never above the roofline
  r.userData.rot0 = r.rotation.clone();
  r.position.copy(r.userData.top); r.visible = false; scene.add(r); fallRocks.push(r);
}
function glowTexture(inner = 'rgba(255,225,160,1)', mid = 'rgba(255,190,110,0.55)') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, mid); gr.addColorStop(1, 'rgba(255,180,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = glowTexture();
const dustTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 7; i++) {
    const x = 24 + ((i * 37) % 80), y = 24 + ((i * 53) % 80), r = 18 + ((i * 29) % 26);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(216,204,178,0.20)'); gr.addColorStop(1, 'rgba(216,204,178,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const dusts = [];
for (let i = 0; i < 10; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dustTex, transparent: true, opacity: 0, depthWrite: false }));
  s.position.set(PORTAL_X - 0.5 + Math.sin(i * 2.2) * 1.8, 1 + (i % 4) * 0.8, 8 + Math.cos(i * 1.7) * 1.6);
  s.visible = false; scene.add(s); dusts.push(s);
}
// flooded-mouth water (whisper insert)
const water = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 5.4), new THREE.MeshStandardMaterial({ color: 0x1a3648, roughness: 0.12, metalness: 0.85, emissive: 0x0a1826, emissiveIntensity: 0.7 }));
const waterLight = new THREE.PointLight(0x9fd4ff, 0, 7, 1.6); waterLight.position.set(PORTAL_X - 1.8, 1.3, 9.0); scene.add(waterLight);
water.rotation.x = -Math.PI / 2; water.position.set(PORTAL_X - 2.2, 0.06, 8); water.visible = false; scene.add(water);
const diverLight = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xbfe8ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
diverLight.position.set(PORTAL_X - 1.2, 0.5, 8); scene.add(diverLight);

/* ---------- modern props ---------- */
const radar = G.makeRadar(); scene.add(radar);
const bore = G.makeBorehole(); bore.position.set(12, 0, 15.5); scene.add(bore);
const mapMesh = G.makeMap(); scene.add(mapMesh);
const pingRings = [];
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.55, 40),
    new THREE.MeshBasicMaterial({ color: 0x9fe8b0, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.03; scene.add(ring); pingRings.push(ring);
}

/* ---------- cavern interior (borehole/shape/glint) ---------- */
const cavern = new THREE.Group(); cavern.position.set(-60, 0, -40); scene.add(cavern);
{
  const rockM = new THREE.MeshStandardMaterial({ color: 0x17181c, roughness: 1, side: THREE.BackSide });
  const room = new THREE.Mesh(new THREE.BoxGeometry(46, 15, 16), rockM);
  room.position.y = -5.5; cavern.add(room);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(46, 16), new THREE.MeshStandardMaterial({ color: 0x101114, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -12.98; cavern.add(floor);
}
const darkTrain = new THREE.Group();
{
  const dl = G.makeLoco();
  dl.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 0.92, metalness: 0.25 }); o.castShadow = false; } });
  darkTrain.add(dl);
  const dw = G.makeGoldWagon(0);
  dw.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.95 }); o.castShadow = false; } });
  dw.position.set(-11.9, 0, 0); darkTrain.add(dw);
  darkTrain.position.set(2, -13.0, 0); darkTrain.rotation.y = 0.12;
  cavern.add(darkTrain);
}
{ // rock shaft the pod descends through (walls catch the pod light)
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 9.4, 20, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x17181d, roughness: 1, side: THREE.DoubleSide }));
  shaft.position.set(6, -2.3, 1.5); cavern.add(shaft);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.09, 8, 20),
    new THREE.MeshStandardMaterial({ color: 0x23242a, roughness: 1 }));
  collar.rotation.x = Math.PI / 2; collar.position.set(6, 2.4, 1.5); cavern.add(collar);
}
const cavPod = new THREE.Group();
{
  const bodyM = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, metalness: 0.7, roughness: 0.35 });
  const pb = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.34, 14), bodyM); cavPod.add(pb);
  const lampM = new THREE.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffdf8a, emissiveIntensity: 3.5 });
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.096, 0.096, 0.05, 14), lampM); band.position.y = 0.06; cavPod.add(band);
  const ls = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), lampM); ls.position.y = -0.2; cavPod.add(ls);
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 6), new THREE.MeshStandardMaterial({ color: 0x22262b }));
  cable.position.y = 0.6; cable.name = 'cable'; cavPod.add(cable);
  cavPod.position.set(6, 0.5, 1.5);
  cavern.add(cavPod);
}
const podSpot = new THREE.SpotLight(0xffe9b8, 0, 30, 0.62, 0.45, 1.2);
cavern.add(podSpot); cavern.add(podSpot.target);
const podGlow = new THREE.PointLight(0xffdf9e, 0, 9, 1.6); cavern.add(podGlow);
// gold glint sprite (shape/glint beats + finale winks reuse)
function goldSprite() {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd777, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.setScalar(0.01); return s;
}
const glintSpr = goldSprite(); glintSpr.position.set(0, 0, 0); cavern.add(glintSpr);
glintSpr.position.set(3.55, -10.75, 0.95);   // on the dark loco's boiler flank (cavern-local)
const winkSpr = goldSprite(); winkSpr.position.set(PORTAL_X - 0.9, 1.6, 8); scene.add(winkSpr);

/* ---------- cast ---------- */
const NAMES = ['aadmi', 'raja', 'aurat', 'budha', 'sipahi'];
const chars = {};
try {
  for (const n of NAMES) { chars[n] = await loadCharacter(`assets/${n}.glb`, TARGET_HEIGHTS[n]); chars[n].group.visible = false; scene.add(chars[n].group); }
  const { attachToBone } = await import('./anim.js');
  attachToBone(chars.raja, 'head', P.makeCap(0x5d4a2a), [0, 0.1, 0.012], [-0.06, 0, 0], [1, 0.78, 1]);       // officer cap (not crown)
  attachToBone(chars.raja, 'head', P.makeBeard(0x2e2019), [0, -0.092, 0.048], [0.1, 0, 0], 0.74);
  attachToBone(chars.budha, 'head', P.makeBeard(0xd8d8d8), [0, -0.092, 0.048], [0.1, 0, 0], 0.74);

  /* ---------- captions (drawn in-scene, reel pattern) ---------- */
  function makeCard(w, h, px = 1024, py = 256) {
    const c = document.createElement('canvas'); c.width = px; c.height = py;
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, depthTest: false }));
    m.renderOrder = 20; camera.add(m);
    return { c, g: c.getContext('2d'), tex, mesh: m };
  }
  function drawCaptionText(card, text) {
    const { c, g, tex } = card;
    g.clearRect(0, 0, c.width, c.height);
    let px = 104;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    while (px > 36) { g.font = `800 ${px}px Arial, sans-serif`; if (g.measureText(text).width <= 890) break; px -= 6; }
    g.lineWidth = Math.max(10, px * 0.15); g.strokeStyle = '#000'; g.lineJoin = 'round';
    g.strokeText(text, c.width / 2, c.height / 2 + 4);
    g.fillStyle = '#fff'; g.fillText(text, c.width / 2, c.height / 2 + 4);
    tex.needsUpdate = true;
  }
  const capCard = makeCard(0.82, 0.20); capCard.mesh.position.set(0, -0.56, -1.6);
  const endCard = makeCard(0.86, 0.22); endCard.mesh.position.set(0, 0.52, -1.6);
  drawCaptionText(endCard, 'STILL BURIED. STILL WAITING.');
  const PHRASES = [
    ['A train full of gold', 'rolled into a dark mountain,', 'and never rolled out again.'],
    ['The legend says it carried', 'three hundred tons', 'of gold and jewels.'],
    ['Below a castle in Poland,', 'men had dug a maze', 'of secret tunnels.'],
    ['They drove the train', 'deep inside, then sealed', 'the mouth with rock.'],
    ['For seventy years, hunters', 'came with old maps,', 'and went home empty.'],
    ['Divers swam the flooded tunnels.', 'One old man whispered', 'the secret.'],
    ['In twenty fifteen, radar found', 'a long train shape', 'under the hill,', 'just where he said.'],
    ['A camera went down', 'a narrow hole,', 'down into the dark.'],
    ['Its light found a huge', 'dark shape, long and still', 'as a train.'],
    ['One tiny point of light', 'winked back from its side,', 'the color of gold.'],
    ['Nobody has opened it yet.', 'If the legend is true,', 'the gold still waits.'],
    ['One day someone will open', 'that mountain. Until then,', 'the gold train waits.'],
  ];
  const SECORDER = ['hook', 'cargo', 'castle', 'seal', 'hunters', 'whisper', 'radar', 'borehole', 'shape', 'glint', 'waiting', 'finale'];
  const CHUNKS = [];
  SECORDER.forEach((sn, i) => {
    const [a, b] = SEC[sn], parts = PHRASES[i], per = (b - a) / parts.length;
    parts.forEach((txt, j) => CHUNKS.push({ t0: (a + per * j) / FPS, t1: (a + per * (j + 1)) / FPS, text: txt }));
  });
  let lastChunk = -2;
  function doCaptions(t) {
    let ci = -1;
    for (let i = 0; i < CHUNKS.length; i++) if (t >= CHUNKS[i].t0 && t < CHUNKS[i].t1) { ci = i; break; }
    if (ci !== lastChunk) { if (ci >= 0) drawCaptionText(capCard, CHUNKS[ci].text); lastChunk = ci; }
    capCard.mesh.material.opacity = ci >= 0
      ? Math.min(ramp(t, CHUNKS[ci].t0, CHUNKS[ci].t0 + 0.08), 1 - ramp(t, CHUNKS[ci].t1 - 0.07, CHUNKS[ci].t1)) : 0;
    const f = t * FPS;
    endCard.mesh.material.opacity = f > 1520 ? ramp(f, 1520, 1545) : 0;
  }

  /* ---------- train motion ---------- */
  const TRAIN0 = -3.15;
  function trainX(f) {
    if (f <= SEC.hook[1]) { const u = f / SEC.hook[1]; return lerp(TRAIN0, 12.35, 1 - Math.pow(1 - u, 3)); }
    if (f < 390) return 12.35;
    if (f <= EV.sealBoom) { const u = (f - 390) / (EV.sealBoom - 390); return lerp(12.35, 47.4, sstep(u)); }
    return 47.4;
  }
  /* ---------- walk tracks (hunters + radar) ---------- */
  function trackPos(keys, t) {
    if (t <= keys[0].t) return { x: keys[0].x, z: keys[0].z };
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t <= b.t) { const u = sstep((t - a.t) / (b.t - a.t)); return { x: lerp(a.x, b.x, u), z: lerp(a.z, b.z, u) }; }
    }
    const Lk = keys[keys.length - 1]; return { x: Lk.x, z: Lk.z };
  }
  // walk state machine: distance-accumulated phase so feet match ground speed
  function walker(ch, keys, t, dt = 0.05) {
    const p0 = trackPos(keys, t), p1 = trackPos(keys, Math.max(0, t - dt));
    const dist = Math.hypot(p0.x - p1.x, p0.z - p1.z);
    ch._dist = (ch._dist || 0) + dist;
    const heading = dist > 0.0004 ? Math.atan2(p0.x - p1.x, p0.z - p1.z) : (ch._heading ?? 0);
    ch._heading = heading;
    return { p: p0, speed: dist / dt, heading };
  }
  function applyWalk(ch, w, t) {
    ch.group.position.set(w.p.x, 0, w.p.z);
    ch.group.rotation.y = w.heading;
    const amp = THREE.MathUtils.clamp(w.speed / 0.8, 0, 1);
    if (amp > 0.04) poseWalkGT(ch, (ch._dist / cycleFor(ch)) * Math.PI * 2, { thigh: 0.40 * amp + 0.05, arm: 0.28 * amp, bob: amp });
    return amp;
  }
  // arms-only push override (after poseWalkGT): aim both arms at handle ends + grip
  function pushArms(ch, tgtL, tgtR) {
    for (const [S, tgt] of [['L', tgtL], ['R', tgtR]]) {
      const shoulder = boneWorldPos(ch, `upperarm01.${S}`, new THREE.Vector3());
      const want = new THREE.Vector3().subVectors(tgt, shoulder).normalize();
      aimBone(ch, `upperarm01.${S}`, `upperarm02.${S}`, want);
